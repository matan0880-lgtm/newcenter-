  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Ostróda'],\n    ['olsztyn', 'Olsztyn', 53.7784, 20.4801, 'right', 0, 0, 'Galeria Warmińska, Olsztyn'], ['myszkow', 'Myszków', 50.5747, 19.3225, 'left', 0, 0, 'Lidl, Myszków'],\n    ['wloclawek', 'Włocławek', 52.6483, 19.0677, 'right', 0, 0, 'Kapitulna 41, Włocławek'], ['suwalki', 'Suwałki', 54.1118, 22.9309, 'right', 0, 0, 'OBI, Suwałki'],\n    ['koszalin', 'Koszalin', 54.1944, 16.1722, 'right', 0, 0, 'Leroy Merlin, Koszalin'], ['kielce', 'Kielce', 50.8661, 20.6286, 'right', 0, 0, 'Radomska 18, Kielce'],\n    ['dzierzoniow', 'Dzierżoniów', 50.7282, 16.6512, 'left', 0, 0, 'Batalionów Chłopskich, Dzierżoniów'], ['grodzisk', 'Grodzisk', 52.1094, 20.6250, 'left'],\n    ['bielsko', 'Bielsko-Biała', 49.8224, 19.0584, 'left']\n  ].map(c => ({ id: c[0], name: c[1], lat: c[2], lng: c[3], side: c[4], opening: !!c[5], exact: !!c[6], addr: c[7] || '' }));\n  const centerSet = cid => !!(byId[cid].exact || (cityData(cid).center && !cityData(cid).center.auto));\n  const byId = {}; CENTERS.forEach(c => byId[c.id] = c);\n  const STATUS = { planned: 'Planned', booked: 'Booked', signed: 'Contract signed', up: 'Up on site' };\n  const BASE_R = 20;\n\n  let D = {}; try { D = JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) {}\n  let sections = {}, pulled = false, dirty = {}, sending = {}, touched = {}, timer = null, syncState = 'load';\n  const ROADS = window.BB_ROADS || {};\n  const roadRef = r => { const f = String(r.ref || ''); if (!f) return ''; if (/^[A-Z]/i.test(f)) return f.toUpperCase(); return (f.length <= 2 ? 'DK ' : 'DW ') + f; };\n  const roadLabel = r => [roadRef(r), r.name].filter(Boolean).join(' · ') || 'Road';\n  const S = { showRoads: true, hlRoad: null, view: 'pl', sel: null, form: null, pick: false, moveCenter: false, modal: null, photo: null, uploading: 0 };\n  const imgCache = {};\n\n  const $ = id => document.getElementById(id);\n  const esc = s => String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const num = v => Number(String(v || '').replace(/\\s/g, '').replace(',', '.')) || 0;\n  const pln = v => Math.round(v).toLocaleString('en-US') + ' PLN';\n  const uid = () => Math.random().toString(36).slice(2, 10);\n  const dist = (a, b) => { const R = 6371, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r; const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };\n  const has = b => b && isFinite(b.lat) && isFinite(b.lng) && b.lat !== '' && b.lng !== '' && b.lat !== null;\n  const isUrl = s => /^https?:\\/\\/|^www\\.|maps\\.app|goo\\.gl/i.test(String(s || '').trim());\n  // buses, taxis, mobile trucks: link field holds an area (\"Piła town\"), not a place\n  const wide = b => !has(b) && String(b.link || '').trim() && !isUrl(b.link);\n  const cityData = cid => D[PFX + cid] || {};\n  const list = cid => Array.isArray(cityData(cid).list) ? cityData(cid).list : [];\n  // photos live in their own row per billboard so edits to the city list can't wipe them\n  const phKey = (cid, bid) => PFX + 'ph.' + cid + '.' + bid;\n  const photosOf = (cid, b) => { const o = D[phKey(cid, b.id)]; return o && Array.isArray(o.photos) ? o.photos : (Array.isArray(b.photos) ? b.photos : []); };\n  const centerPos = cid => { const c = byId[cid], o = cityData(cid).center; return o && isFinite(o.lat) ? { lat: +o.lat, lng: +o.lng } : { lat: c.lat, lng: c.lng }; };\n  const radiusOf = cid => { const cp = centerPos(cid); let m = 0; list(cid).forEach(b => { if (has(b)) m = Math.max(m, dist(cp, b)); }); return m > BASE_R ? Math.ceil(m + 2) : BASE_R; };\n  const gmaps = b => { const raw = String(b.link || '').trim(); if (/^https?:\\/\\//i.test(raw)) return raw; if (has(b)) return 'https://www.google.com/maps/search/?api=1&query=' + b.lat + ',' + b.lng; return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(raw || b.name || ''); };\n\n  // ---------- location parsing ----------\n  const inPL = (la, lo) => la > 48.5 && la < 55.2 && lo > 13.8 && lo < 24.5;\n  function dms(s) {\n    const m = s.match(/(\\d{1,2})°\\s*(\\d{1,2})['′]\\s*([\\d.]+)[\"″]?\\s*([NS])[\\s,]+(\\d{1,3})°\\s*(\\d{1,2})['′]\\s*([\\d.]+)[\"″]?\\s*([EW])/i);\n    if (!m) return null;\n    let la = +m[1] + m[2] / 60 + m[3] / 3600, lo = +m[5] + m[6] / 60 + m[7] / 3600;\n    if (/s/i.test(m[4])) la = -la; if (/w/i.test(m[8])) lo = -lo;\n    return [la, lo];\n  }\n  function parseLoc(input) {\n    let s = String(input || '').trim(); if (!s) return null;\n    try { s = decodeURIComponent(s); } catch (e) {}\n    const pats = [/!3d(-?\\d+\\.\\d+)!4d(-?\\d+\\.\\d+)/, /[?&](?:q|query|ll|sll|destination|daddr|center)=(-?\\d+\\.\\d+)\\s*[,+ ]\\s*(-?\\d+\\.\\d+)/, /\\/place\\/(-?\\d+\\.\\d+)\\s*,\\s*(-?\\d+\\.\\d+)/, /@(-?\\d+\\.\\d+),(-?\\d+\\.\\d+)/, /^(-?\\d{1,2}\\.\\d+)\\s*[,; ]\\s*(-?\\d{1,3}\\.\\d+)$/, /(\\d{2}\\.\\d{3,})\\s*,\\s*(\\d{1,2}\\.\\d{3,})/];\n    for (const p of pats) { const m = s.match(p); if (m && inPL(+m[1], +m[2])) return [+m[1], +m[2]]; }\n    const d = dms(s); if (d && inPL(d[0], d[1])) return d;\n    return null;\n  }\n  const isShort = s => /(goo\\.gl|maps\\.app|g\\.co)\\//i.test(s);\n  const shortCache = {};\n  function resolveShort(link) {\n    const u = String(link || '').trim(); if (!isShort(u)) return Promise.resolve(null);\n    if (!(u in shortCache)) shortCache[u] = jsonp('&resolve=' + encodeURIComponent(/^https?:/i.test(u) ? u : 'https://' + u)).then(r => r && r.url ? parseLoc(r.url) : null).catch(() => null);\n    return shortCache[u];\n  }\n  function textQuery(s) {\n    s = String(s || '').trim(); if (!s) return '';\n    if (!/^https?:\\/\\/|www\\.|\\.com|\\.pl\\//i.test(s)) return s;\n    try { s = decodeURIComponent(s); } catch (e) {}\n    let m = s.match(/[?&](?:q|query|destination|daddr)=([^&]+)/); if (m) return m[1].replace(/\\+/g, ' ');\n    m = s.match(/\\/place\\/([^/@]+)/); if (m) return m[1].replace(/\\+/g, ' ');\n    m = s.match(/\\/search\\/([^/@]+)/); if (m) return m[1].replace(/\\+/g, ' ');\n    return '';\n  }\n  let geoQ = Promise.resolve();\n  const near = (g, cid, km) => g && inPL(g[0], g[1]) && dist(centerPos(cid), { lat: g[0], lng: g[1] }) < km ? g : null;\n  function geocode(q, cid) {\n    const c = centerPos(cid), city = byId[cid].name;\n    const full = new RegExp(city.split(/[- ]/)[0], 'i').test(q) ? q : q + ', ' + city;\n    const vb = [c.lng - .6, c.lat + .4, c.lng + .6, c.lat - .4].join(',');\n    const nomi = () => fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pl&viewbox=' + vb + '&q=' + encodeURIComponent(full))\n      .then(r => r.json()).then(a => a && a[0] && !/^(city|town|municipality|county|state|administrative)$/.test(a[0].addresstype || a[0].type) ? near([+a[0].lat, +a[0].lon], cid, 80) : null).catch(() => null);\n    const photon = () => fetch('https://photon.komoot.io/api/?limit=1&lat=' + c.lat + '&lon=' + c.lng + '&q=' + encodeURIComponent(full))\n      .then(r => r.json()).then(j => { const f = j && j.features && j.features[0]; return f && !/^(city|county|state|district)$/.test(f.properties.type || '') ? near([f.geometry.coordinates[1], f.geometry.coordinates[0]], cid, 80) : null; }).catch(() => null);\n    const run = () => nomi().then(g => g || photon());\n    const p = geoQ.then(run); geoQ = p.then(() => new Promise(r => setTimeout(r, 1100))); return p;\n  }\n\n  // ---------- Google Sheet sync ----------\n  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(D)); } catch (e) {} }\n  function jsonp(params) {\n    return new Promise((resolve, reject) => {\n      const cb = 'bigbb' + Math.random().toString(36).slice(2), s = document.createElement('script');\n      const done = () => { window[cb] = () => {}; s.remove(); clearTimeout(tm); };\n      const tm = setTimeout(() => { done(); reject(new Error('timeout')); }, 20000);\n      window[cb] = v => { done(); resolve(v); };\n      s.onerror = () => { done(); reject(new Error('network')); };\n      s.src = API + '?callback=' + cb + '&t=' + Date.now() + (params || '');\n      document.head.appendChild(s);\n    });\n  }\n  function setSync(v) {\n    syncState = v; const el = $('sync');\n    el.querySelector('i').style.background = v === 'ok' ? 'var(--ok)' : v === 'err' ? 'var(--err)' : 'var(--warn)';\n    el.querySelector('span').textContent = v === 'ok' ? 'Synced' : v === 'err' ? 'Offline' : v === 'save' ? 'Saving…' : 'Loading…';\n  }\n  function pull() {\n    jsonp().then(j => {\n      const all = (j && j.sections) || {}, data = {};\n      sections = all;\n      for (const k in all) if (k.indexOf(PFX) === 0) data[k] = typeof all[k] === 'string' ? safeParse(all[k]) : all[k];\n      for (const k in D) if (!(k in data)) data[k] = D[k];\n      const fresh = Date.now() - 15000;\n      for (const k in sending) data[k] = sending[k];\n      for (const k in dirty) data[k] = dirty[k];\n      for (const k in touched) if (touched[k] > fresh && D[k] !== undefined) data[k] = D[k];\n      const changed = JSON.stringify(data) !== JSON.stringify(D);\n      D = data; saveLocal(); pulled = true;\n      if (changed) render(false);\n      if (!Object.keys(dirty).length && !Object.keys(sending).length) setSync('ok');\n      runImport();\n    }).catch(() => setSync('err'));\n  }\n  function safeParse(s) { try { return JSON.parse(s); } catch (e) { return {}; } }\n  function up(cid, fn) {\n    const key = PFX + cid, s = JSON.parse(JSON.stringify(D[key] || {}));\n    s.list = Array.isArray(s.list) ? s.list : [];\n    fn(s); D = Object.assign({}, D, { [key]: s }); saveLocal();\n    dirty[key] = s; touched[key] = Date.now(); setSync('save');\n    clearTimeout(timer); timer = setTimeout(flush, 700);\n  }\n  function upPh(cid, b, fn) {\n    const key = phKey(cid, b.id), s = { photos: fn(photosOf(cid, b).slice()) };\n    D = Object.assign({}, D, { [key]: s }); saveLocal();\n    dirty[key] = s; touched[key] = Date.now(); setSync('save');\n    clearTimeout(timer); timer = setTimeout(flush, 300);\n  }\n  function flush() {\n    clearTimeout(timer);\n    const patch = dirty, keys = Object.keys(patch);\n    if (!keys.length) { setSync('ok'); return; }\n    dirty = {};\n    const step = i => {\n      if (i >= keys.length) { setSync(Object.keys(dirty).length ? 'save' : 'ok'); return; }\n      const one = {}; one[keys[i]] = patch[keys[i]]; sending[keys[i]] = patch[keys[i]];\n      const enc = encodeURIComponent(JSON.stringify(one));\n      const send = enc.length < 5000 ? jsonp('&patch=' + enc).then(r => { if (!r || !r.ok) throw new Error('fail'); })\n        : fetch(API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ patch: one }) });\n      send.then(() => { delete sending[keys[i]]; step(i + 1); }).catch(() => {\n        delete sending[keys[i]];\n        for (let j = i; j < keys.length; j++) if (!(keys[j] in dirty)) dirty[keys[j]] = patch[keys[j]];\n        setSync('err'); clearTimeout(timer); timer = setTimeout(flush, 5000);\n      });\n    };\n    step(0);\n  }\n\n  // ---------- import from the Openings portal (each row once) ----------\n  let importing = false;\n  const ikey = r => 'r:' + String(r.link || r.loc || '').trim().toLowerCase();\n  async function runImport() {\n    if (importing || !pulled) return; importing = true;\n    try {\n      for (const c of CENTERS.filter(x => x.opening)) {\n        let mk = sections[c.id + '.mkt']; if (typeof mk === 'string') mk = safeParse(mk);\n        const rows = (mk && Array.isArray(mk.billboards) ? mk.billboards : []).filter(r => r && (String(r.loc || '').trim() || String(r.link || '').trim()));\n        const imp = cityData(c.id).imp || [];\n        const fresh = rows.filter(r => imp.indexOf(ikey(r)) < 0);\n        if (!fresh.length) continue;\n        const add = [];\n        for (const r of fresh) {\n          const b = { id: uid(), name: r.loc || '', company: r.company || currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 3h6v6\"><\u002Fpath><path d=\"M10 14 21 3\"><\u002Fpath><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"><\u002Fpath><\u002Fsvg><\u002Fa>' +\n        '<button data-act=\"edit\" data-id=\"' + esc(b.id) + '\" title=\"Edit\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>' +\n        '<button data-act=\"del\" data-id=\"' + esc(b.id) + '\" title=\"Remove\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv><\u002Ftd><\u002Ftr>';\n    }).join('');\n    const rr = ROADS[cid] || [];\n    const covered = r => l.some(b => has(b) && r.lines.some(ln => ln.some(p => dist({ lat: p[0], lng: p[1] }, b) < 0.25)));\n    const roadsHtml = rr.length && S.showRoads ? '<div class=\"sec-h\"><h2>Key roads<\u002Fh2><span>We drew 16 car routes into BIG ' + esc(byId[cid].name) + ' — from 8 directions, starting 8 km and 18 km away. The roads most of those routes pass through are where shoppers drive to us. Thin gold line on the map.<\u002Fspan><\u002Fdiv>' +\n      '<div class=\"tbl-wrap\"><table><thead><tr><th><\u002Fth><th>Road<\u002Fth><th>Routes into BIG on this road<\u002Fth><th class=\"n\">Closest to center<\u002Fth><th>Our billboards<\u002Fth><\u002Ftr><\u002Fthead><tbody>' +\n      rr.map(r => { const c = covered(r); return '<tr data-act=\"road\" data-rank=\"' + r.rank + '\" class=\"' + (S.hlRoad === r.rank ? 'sel' : '') + '\"><td style=\"width: 44px\"><span class=\"rk\">' + r.rank + '<\u002Fspan><\u002Ftd>' +\n        '<td><div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\">' + (roadRef(r) ? '<span class=\"rref\">' + esc(roadRef(r)) + '<\u002Fspan>' : '') + '<span class=\"nm\">' + esc(r.name || roadRef(r) || 'Road') + '<\u002Fspan><\u002Fdiv><\u002Ftd>' +\n        '<td><div style=\"display: flex; align-items: center; gap: 10px\"><div class=\"rbar\" style=\"flex: 1\"><i style=\"width: ' + r.trips + '%\"><\u002Fi><\u002Fdiv><span style=\"font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap\">' + Math.max(1, Math.round(r.trips / 100 * 16)) + ' of 16<\u002Fspan><\u002Fdiv><\u002Ftd>' +\n        '<td class=\"n\">' + (r.near < 0.5 ? 'At the center' : r.near.toFixed(1) + ' km') + '<\u002Ftd>' +\n        '<td>' + (c ? '<span class=\"tag up\">Covered<\u002Fspan>' : '<span class=\"tag booked\">Opportunity<\u002Fspan>') + '<\u002Ftd><\u002Ftr>'; }).join('') +\n      '<\u002Ftbody><\u002Ftable><\u002Fdiv>' : '';\n    el.innerHTML = stats + roadsHtml + '<div class=\"sec-h\"><h2>Billboards in ' + esc(byId[cid].name) + '<\u002Fh2><span>' + l.length + ' total · ' + pln(m) + ' per month<\u002Fspan><\u002Fdiv>' +\n      (l.length ? '<div class=\"tbl-wrap\"><table><thead><tr><th><\u002Fth><th>Location<\u002Fth><th class=\"n\">From center<\u002Fth><th>Status<\u002Fth><th class=\"n\">Installation<\u002Fth><th class=\"n\">Monthly<\u002Fth><th class=\"n\">Replacement<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody>' + rows +\n        '<\u002Ftbody><tfoot><tr><td><\u002Ftd><td>Total · ' + l.length + ' billboards<\u002Ftd><td><\u002Ftd><td><\u002Ftd><td class=\"n\">' + pln(i) + '<\u002Ftd><td class=\"n\" style=\"color: var(--red)\">' + pln(m) + '<span style=\"font-weight: 400; color: var(--mute); font-size: 12px\"> / mo<\u002Fspan><\u002Ftd><td class=\"n\">' + pln(s) + '<\u002Ftd><td><\u002Ftd><\u002Ftr><\u002Ftfoot><\u002Ftable><\u002Fdiv>'\n        : '<div class=\"empty\">No billboards in ' + esc(byId[cid].name) + ' yet — add one with + Billboard.<\u002Fdiv>');\n  }\n  function render(full) {\n    renderHead(); renderHint(); renderSummary();\n    if (S.view === 'pl') drawPoland(); else drawCity(S.view);\n    if (S.modal && S.modal.type === 'bb') renderModal();\n  }\n\n  document.addEventListener('click', e => {\n    const t = e.target.closest('[data-act]'); if (!t || t.dataset.act === 'noop') return;\n    if (e.target.closest('[data-stop]')) return;\n    const a = t.dataset.act, id = t.dataset.id;\n    if (a === 'poland') goPoland();\n    else if (a === 'city') goCity(id);\n    else if (a === 'add') openForm(null);\n    else if (a === 'sel') { select(id, true); openBB(id); }\n    else if (a === 'mclose') closeModal();\n    else if (a === 'roads') { S.showRoads = !S.showRoads; S.hlRoad = null; drawRoads(S.view); renderActions(); renderSummary(); }\n    else if (a === 'road') focusRoad(+t.dataset.rank);\n    else if (a === 'mcopy') { const u = t.dataset.url; const done = () => { t.textContent = 'Copied ✓'; setTimeout(() => { t.textContent = 'Copy link'; }, 1600); };\n      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done, () => prompt('Copy the link:', u)); else prompt('Copy the link:', u); }\n    else if (a === 'mprev' || a === 'mnext') stepBB(a === 'mnext' ? 1 : -1);\n    else if (a === 'medit') { const b = list(S.view).find(x => x.id === id); closeModal(); if (b) openForm(b); }\n    else if (a === 'mdel') { const b = list(S.view).find(x => x.id === id); if (b && confirm('Remove billboard “' + (b.name || 'Unnamed') + '”?')) { up(S.view, s => { s.list = s.list.filter(x => x.id !== id); }); closeModal(); S.sel = null; render(true); } }\n    else if (a === 'mphoto') { S.photo = t.dataset.key; renderModal(); }\n    else if (a === 'maddphoto') $('mFile').click();\n    else if (a === 'mphotodel') { const k = S.photo; if (k && confirm('Remove this photo?')) { const b = list(S.view).find(y => y.id === S.modal.id); if (b) upPh(S.view, b, ps => ps.filter(p => p !== k)); S.photo = null; renderModal(); drawCity(S.view); } }\n    else if (a === 'cset') saveCenterLink();\n    else if (a === 'cdrag') { closeModal(); S.moveCenter = true; drawCity(S.view); renderActions(); renderHint(); }\n    else if (a === 'center') openCenter();\n    else if (a === 'edit') { e.stopPropagation(); const b = list(S.view).find(x => x.id === id); if (b) openForm(b); }\n    else if (a === 'place') { e.stopPropagation(); const b = list(S.view).find(x => x.id === id); if (b) openForm(b, true); }\n    else if (a === 'del') {\n      e.stopPropagation(); const b = list(S.view).find(x => x.id === id);\n      if (b && confirm('Remove billboard “' + (b.name || 'Unnamed') + '”?')) { const cid = S.view; up(cid, s => { s.list = s.list.filter(x => x.id !== id); }); if (S.sel === id) S.sel = null; render(true); }\n    }\n    else if (a === 'movecenter') { S.moveCenter = false; drawCity(S.view); renderActions(); renderHint(); fitCity(S.view, true); }\n  });\n\n  const h = decodeURIComponent(location.hash.slice(1));\n  render(true);\n  let lastW = 0, lastH = 0;\n  map.on('dragstart', () => { userMoved = true; });\n  const refit = () => {\n    const el = $('map'), w = el.clientWidth, hh = el.clientHeight;\n    if (!w || !hh || (w === lastW && hh === lastH)) return;\n    const first = !lastW; lastW = w; lastH = hh;\n    map.invalidateSize();\n    if (first || (!userMoved && !S.form)) { if (S.view === 'pl') map.fitBounds(PL, { padding: [16, 16] }); else fitCity(S.view, false); }\n  };\n  new ResizeObserver(refit).observe(document.querySelector('.mapwrap'));\n  window.addEventListener('load', refit);\n  requestAnimationFrame(refit);\n  if (byId[h]) setTimeout(() => goCity(h, false), 400);\n  pull();\n  setInterval(() => { if (!S.form) pull(); }, 10000);\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
